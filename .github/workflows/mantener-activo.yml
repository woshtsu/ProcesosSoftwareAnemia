name: Mantener activo el servicio de Render

# El plan gratuito de Render apaga el servicio tras 15 min sin tráfico y el
# arranque en frío tarda ~20-50 s. Este ping lo mantiene despierto solo en
# horario de atención (07:00-22:00, America/Lima = UTC-5) para no agotar las
# 750 h mensuales gratuitas, que se comparten con los demás servicios del
# workspace. GitHub puede retrasar u omitir ejecuciones programadas.

on:
  schedule:
    - cron: "*/10 12-23 * * *"
    - cron: "*/10 0-2 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar /api/salud
        run: |
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://softwareanemia-virginia.onrender.com/api/salud
