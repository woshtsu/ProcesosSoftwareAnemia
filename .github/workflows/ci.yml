name: CI y producción — PMV Anemia Junín

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pmv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: pmv_fastapi

jobs:
  calidad-y-pruebas:
    runs-on: ubuntu-24.04  # Playwright 1.56 no soporta Ubuntu 26.04 (ubuntu-latest desde el 19/10/2026)
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anemia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pmv_fastapi/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Análisis estático (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas unitarias, integración y arquitectura + cobertura (SQLite)
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing --junitxml=reporte-pruebas.xml
      - name: Contrato OpenAPI al día
        run: python -m scripts.exportar_openapi --verificar
      - name: Pruebas de integración contra PostgreSQL
        env:
          PGPASSWORD: postgres
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/anemia
        run: |
          psql -h localhost -U postgres -d anemia -v ON_ERROR_STOP=1 -f db/01_esquema_postgresql.sql
          pytest tests/integracion -q --no-cov
      - name: Pruebas E2E (Playwright)
        run: |
          python -m playwright install --with-deps chromium
          pytest tests/e2e -m e2e -q --no-cov
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: |
            pmv_fastapi/coverage.xml
            pmv_fastapi/reporte-pruebas.xml
      - name: Análisis SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          projectBaseDir: pmv_fastapi

  imagen:
    needs: calidad-y-pruebas
    runs-on: ubuntu-24.04  # Playwright 1.56 no soporta Ubuntu 26.04 (ubuntu-latest desde el 19/10/2026)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen Docker del PMV
        run: docker build -t anemia-junin-pmv:${{ github.sha }} .

  produccion:
    needs: [calidad-y-pruebas, imagen]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04  # Playwright 1.56 no soporta Ubuntu 26.04 (ubuntu-latest desde el 19/10/2026)
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar cliente PostgreSQL
        working-directory: .
        run: pip install psycopg2-binary==2.9.13
      - name: Verificar esquema sin modificar producción y solicitar despliegue
        working-directory: .
        env:
          SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import urllib.request
          import psycopg2

          database = os.environ.get('SUPABASE_DATABASE_URL', '')
          hook = os.environ.get('RENDER_DEPLOY_HOOK_URL', '')
          if not database or not hook:
              sys.exit('Faltan secrets SUPABASE_DATABASE_URL o RENDER_DEPLOY_HOOK_URL.')
          parts = urllib.parse.urlsplit(hook)
          if parts.scheme != 'https' or parts.hostname != 'api.render.com':
              sys.exit('El deploy hook debe ser HTTPS de api.render.com.')
          try:
              dsn = database.replace('postgresql+psycopg2://', 'postgresql://', 1)
              with psycopg2.connect(dsn, sslmode='require', connect_timeout=15) as conn:
                  conn.set_session(readonly=True)
                  with conn.cursor() as cur:
                      cur.execute('SET LOCAL statement_timeout = 15000')
                      cur.execute('SELECT id FROM public.nino LIMIT 0')
                      cur.execute('SELECT origen, codigo_origen FROM public.nino LIMIT 0')
                      cur.execute('SELECT id FROM public.asistencia_control LIMIT 0')
                      cur.execute('SELECT id FROM public.evaluacion_hemoglobina LIMIT 0')
                      cur.execute('SELECT nino_id FROM public.v_ultimo_control LIMIT 0')
                      # Esquema 3.0 (sin conexión y visitas) y 4.0 (recordatorios y barreras)
                      for tabla in ('visita_domiciliaria', 'operacion_sincronizada', 'conflicto_sincronizacion', 'recordatorio', 'barrera'):
                          cur.execute(f'SELECT 1 FROM public.{tabla} LIMIT 0')
          except Exception:
              sys.exit('No se pudo verificar PostgreSQL (esquema 4.0). Revisar conexión y ejecutar db/03, db/04 y db/02_supabase.sql; credenciales omitidas.')
          query = dict(urllib.parse.parse_qsl(parts.query))
          query['ref'] = os.environ['GITHUB_SHA']
          url = urllib.parse.urlunsplit(parts._replace(query=urllib.parse.urlencode(query)))
          try:
              request = urllib.request.Request(url, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status not in (200, 202):
                      sys.exit('Render no aceptó el despliegue.')
          except Exception:
              sys.exit('No se pudo solicitar el despliegue en Render; revisar el hook en Settings.')
          print('Render aceptó la solicitud del commit probado. Confirmar estado Live en Render; esto no certifica el despliegue final.')
          PY
