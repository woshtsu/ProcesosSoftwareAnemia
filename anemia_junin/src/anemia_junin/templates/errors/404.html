{% extends "base.html" %}
{% block title %}404 — No encontrado{% endblock %}
{% block content %}
<div class="empty-state">
  <h1>404 — No encontrado</h1>
  {% if dni %}
    <p>No se encontró un niño con DNI <code>{{ dni }}</code>.</p>
  {% else %}
    <p>La página solicitada no existe.</p>
  {% endif %}
  <a href="{{ url_for('web.lista_ninos') }}" class="btn btn-primary">Ir a la lista</a>
</div>
{% endblock %}
